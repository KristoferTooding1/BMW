<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BMW M Collection</title>
    <link rel="stylesheet" href="pood.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .cart-page {
            margin-top: 80px;
            padding: 60px 40px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .cart-header {
            margin-bottom: 48px;
        }

        .cart-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .cart-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .cart-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 24px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .cart-item:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.1);
        }

        .cart-item-image {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .cart-item-info h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cart-item-price {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 12px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            width: fit-content;
        }

        .quantity-btn {
            background: var(--accent);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .quantity-value {
            font-weight: 700;
            font-size: 16px;
            min-width: 32px;
            text-align: center;
        }

        .cart-item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .item-total {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        .remove-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .cart-summary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .summary-row.total {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid var(--border);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .summary-row.total .amount {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.4);
        }

        .continue-shopping {
            width: 100%;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .continue-shopping:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .empty-cart {
            text-align: center;
            padding: 80px 40px;
        }

        .empty-cart h2 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 16px;
        }

        .empty-cart p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        @media (max-width: 1024px) {
            .cart-grid {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 16px;
            }

            .cart-item-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-container">
        <div class="nav-brand">BMW M</div>
        <div class="nav-links">
            <a href="esileht.html">Collection</a>
            <a href="esileht.html#features">Features</a>
            <a href="ostukorv.html" class="cart-btn">
                <span class="cart-icon">Cart</span>
                <span id="cart-count" class="cart-badge" style="display: none;"></span>
            </a>
        </div>
    </div>
</nav>

<div class="cart-page">
    <div class="cart-header">
        <h1>Shopping Cart</h1>
        <p>Review your selected BMW M vehicles</p>
    </div>

    <div id="cart-content">
        <!-- Cart items will be inserted here by JavaScript -->
    </div>
</div>

<script src="theme.js"></script>
<script src="cart.js"></script>
<script>
// Enhanced cart display for new design
function displayCart() {
    const cartContent = document.getElementById('cart-content');
    
    if (cart.length === 0) {
        cartContent.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Start building your dream garage with our BMW M collection</p>
                <a href="esileht.html" class="btn-primary-new">Explore Collection</a>
            </div>
        `;
        return;
    }
    
    let itemsHTML = '';
    cart.forEach(item => {
        const itemImage = item.image || 'images/m3.jpg';
        itemsHTML += `
            <div class="cart-item">
                <div class="cart-item-image">
                    <img src="${itemImage}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">
                </div>
                <div class="cart-item-info">
                    <h3>${item.name}</h3>
                    <div class="cart-item-price">€${item.price.toLocaleString()}</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                        <span class="quantity-value">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                </div>
                <div class="cart-item-actions">
                    <div class="item-total">€${(item.price * item.quantity).toLocaleString()}</div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
                </div>
            </div>
        `;
    });
    
    const subtotal = calculateTotal();
    const tax = subtotal * 0.20; // 20% VAT
    const total = subtotal + tax;
    
    cartContent.innerHTML = `
        <div class="cart-grid">
            <div class="cart-items">
                ${itemsHTML}
            </div>
            <div class="cart-summary">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>€${subtotal.toLocaleString()}</span>
                </div>
                <div class="summary-row">
                    <span>Tax (20%)</span>
                    <span>€${tax.toLocaleString()}</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span class="amount">€${total.toLocaleString()}</span>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
                <a href="esileht.html" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>
    `;
}

// Call on page load
window.addEventListener('DOMContentLoaded', function() {
    displayCart();
    updateCartCount();
});
</script>

</body>
</html>
