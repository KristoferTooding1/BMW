<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BMW M Collection</title>
    <link rel="stylesheet" href="pood.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-container">
        <a href="esileht.html" class="nav-brand" style="text-decoration: none; color: inherit;">BMW M</a>
        <div class="nav-links">
            <a href="esileht.html">Collection</a>
            <a href="esileht.html#features">Features</a>
            <a href="ostukorv.html" class="cart-btn">
                <span class="cart-icon">Cart</span>
                <span id="cart-count" class="cart-badge" style="display: none;"></span>
            </a>
        </div>
    </div>
</nav>

<div class="cart-page">
    <div class="cart-header">
        <h1>Shopping Cart</h1>
        <p>Review your selected BMW M vehicles</p>
    </div>

    <div id="cart-content">
        <!-- Cart items will be inserted here by JavaScript -->
    </div>
</div>

<script src="theme.js"></script>
<script src="cart.js"></script>
<script>
// Enhanced cart display for new design
function displayCart() {
    const cartContent = document.getElementById('cart-content');
    
    if (cart.length === 0) {
        cartContent.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Start building your dream garage with our BMW M collection</p>
                <a href="esileht.html" class="btn-primary-new">Explore Collection</a>
            </div>
        `;
        return;
    }
    
    let itemsHTML = '';
    cart.forEach(item => {
        const itemImage = item.image || 'images/m3.jpg';
        itemsHTML += `
            <div class="cart-item">
                <div class="cart-item-image">
                    <img src="${itemImage}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">
                </div>
                <div class="cart-item-info">
                    <h3>${item.name}</h3>
                    <div class="cart-item-price">€${item.price.toLocaleString()}</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                        <span class="quantity-value">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                </div>
                <div class="cart-item-actions">
                    <div class="item-total">€${(item.price * item.quantity).toLocaleString()}</div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
                </div>
            </div>
        `;
    });
    
    const subtotal = calculateTotal();
    const tax = subtotal * 0.20; // 20% VAT
    const total = subtotal + tax;
    
    cartContent.innerHTML = `
        <div class="cart-grid">
            <div class="cart-items">
                ${itemsHTML}
            </div>
            <div class="cart-summary">
                <h3 class="summary-title">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>€${subtotal.toLocaleString()}</span>
                </div>
                <div class="summary-row">
                    <span>Tax (20%)</span>
                    <span>€${tax.toLocaleString()}</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span class="amount">€${total.toLocaleString()}</span>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
                <a href="esileht.html" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>
    `;
}

// Call on page load
window.addEventListener('DOMContentLoaded', function() {
    displayCart();
    updateCartCount();
});
</script>

</body>
</html>
